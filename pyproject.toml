[project]
name = "small-model-router"
version = "0.1.0"
description = "Route support requests with a fine-tuned small model; escalate to a frontier model only when unsure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "datasets>=3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.8",
    "rich>=13",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
]

[project.scripts]
router = "router.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
